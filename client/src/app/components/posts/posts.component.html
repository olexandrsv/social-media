<div class="post-component">
  <div class="">
    <button mat-fab extended color="primary" (click)="createPost()">
      <mat-icon>add</mat-icon>
      Write Post
    </button>
  </div>
  <div class="container">
    @for (post of posts; track post; let i = $index) {
      <div>
        <div class="post2">
          <div class="control-buttons">
            <button (click)="updatePost(i)" mat-icon-button color="primary">
              <mat-icon>create</mat-icon>
            </button>
            <button (click)="deletePost(i)" mat-icon-button color="warn">
              <mat-icon>clear</mat-icon>
            </button>
          </div>
          <div class="text">
            @for (list of post.parsedText; track list) {
              <div class="code">
                @for (el of list; track el) {
                  <div>
                    <h3 style="color:{{el.color}}">{{el.text}}</h3>
                  </div>
                }
              </div>
            }
          </div>
          @for (link of post['images']; track link) {
            <img width="90%" height="90%" src="{{link.getURL()}}">
          }
          <nav>
            @for (link of post['files']; track link) {
              <ul>
                <li><a href="{{link.getURL()}}">{{link.getURL()}}</a></li>
              </ul>
            }
          </nav>
          <br>
            <button (click)="openDialog(i)" mat-icon-button color="primary">
              <mat-icon>comment</mat-icon>
            </button>
          </div>
          <br>
            <br>
            </div>
          }
        </div>
        <br>
          <br>
          </div>
