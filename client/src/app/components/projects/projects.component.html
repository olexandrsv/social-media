<div class="projects-component">
  <div class="">
    <button mat-fab extended color="primary" (click)="addProject()">
      <mat-icon>add</mat-icon>
      Add Project
    </button>
  </div>
  <br>
    <div class="projects-container">
      @for (project of projects; track project; let i = $index) {
        <div class="project">
          <div class="project-header">
            <div class="control-buttons">
              <button (click)="update(i)" mat-icon-button color="primary">
                <mat-icon>create</mat-icon>
              </button>
              <button (click)="delete(i)" mat-icon-button color="warn">
                <mat-icon>clear</mat-icon>
              </button>
            </div>
          </div>
          <div class="project-body">
            <table class="project-table">
              <tr>
                <td>Author</td>
                <td>{{project.login}}</td>
              </tr>
              <tr>
                <td>Name</td>
                <td>{{project.name}}</td>
              </tr>
              <tr>
                <td>Description</td>
                <td>{{project.description}}</td>
              </tr>
              <tr>
                <td>Stack</td>
                <td>{{project.stack}}</td>
              </tr>
            </table>
            <!-- <div class="project-name">
            {{project.name}}
          </div>
          <div class="project-description">
            {{project.description}}
          </div>
          <div class="project-stack">
            {{project.stack}}
          </div> -->
        </div>
      </div>
    }
  </div>
</div>
