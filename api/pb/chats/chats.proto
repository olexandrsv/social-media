syntax = "proto3";

package chats;
option go_package = "api/pb/chats";

service Chats{
    rpc LastReadMessages (LastReadMessagesReq) returns (LastReadMessagesResp) {}
}

message LastReadMessagesReq {
    int64 userID = 1;
}

message LastReadMessagesResp{
    repeated Message messages = 1;
    Error err = 2;
}

message Message {
    string lastMessageID = 1;
    int64 chatID = 2;
}

message Error{
    int64 code = 1;
    string message = 2;
}